name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid tag format. Use vMAJOR.MINOR.PATCH (example: v1.0.2)"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          python3 scripts/write_version.py "${VERSION}"

      - name: Build and package
        env:
          CS2_PICKER_VERSION: ${{ env.VERSION }}
        run: |
          chmod +x scripts/build.sh scripts/lib.sh scripts/run.sh
          ./scripts/build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CS2 Server Picker v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          files: |
            dist/CS2-Server-Picker-v${{ env.VERSION }}-macOS.zip
            dist/CS2-Server-Picker-v${{ env.VERSION }}-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
