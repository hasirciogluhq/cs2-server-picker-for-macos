name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e .

      - name: Syntax check
        run: |
          python3 -m compileall -q src

      - name: Import check
        run: python3 -c "from cs2_picker.ui.app import main; from cs2_picker._version import __version__; print(__version__)"
